<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>교사 통제실</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; display: flex; gap: 20px; background-color: #f4f4f4; }
        .panel { flex: 1; border: 1px solid #ccc; border-radius: 8px; background: white; overflow: hidden; display: flex; flex-direction: column; height: 80vh; }
        .panel-header { background: #333; color: white; padding: 15px; margin: 0; text-align: center; font-weight: bold; }
        #chat-box { background-color: #b2c7d9; flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg-wrapper { display: flex; flex-direction: column; margin-bottom: 10px; max-width: 75%; }
        .sender-name { font-size: 12px; margin-bottom: 4px; color: #444; }
        .msg { padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-break: break-all; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .bot-wrapper { align-items: flex-start; align-self: flex-start; }
        .bot { background-color: #ffffff; border-top-left-radius: 2px; }
        .user-wrapper { align-items: flex-end; align-self: flex-end; }
        .user { background-color: #ffeb33; border-top-right-radius: 2px; }
        #suggestions-box { flex: 1; overflow-y: auto; padding: 15px; background: #fff; }
        .suggestion-item { padding: 15px; border: 2px solid #007bff; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .suggestion-item:hover { background: #007bff; color: white; }
    </style>
</head>
<body>
    <div class="panel">
        <h2 class="panel-header">메인 단톡방 화면 (카톡 뷰)</h2>
        <div id="chat-box">
            <div class="msg-wrapper bot-wrapper">
                <div class="sender-name">주동자</div>
                <div class="msg bot">야 오늘 체육시간에 저새끼 뚝딱거리는 거 본 사람? ㅋㅋㅋ</div>
            </div>
            <div class="msg-wrapper bot-wrapper">
                <div class="sender-name">동조자1</div>
                <div class="msg bot">아 ㅋㅋㅋ 진짜 개에바였음 ㅈㄴ 뇌절하더라</div>
            </div>
            <div class="msg-wrapper bot-wrapper">
                <div class="sender-name">주동자</div>
                <div class="msg bot">찐따련 지가 뭐라도 되는 줄 아나봄 ㅇㅇ</div>
            </div>
            <div class="msg-wrapper bot-wrapper">
                <div class="sender-name">동조자2</div>
                <div class="msg bot">아 사진 찍어놨어야 했는데 개아깝네 ㅋㅋㅋ</div>
            </div>
            <div class="panel-wrapper msg-wrapper bot-wrapper">
                <div class="sender-name">주동자</div>
                <div class="msg bot">야 ㅋㅋ 여기 단톡방 다 보고 있는 거 아니까 숨지 말고 말해봐</div>
            </div>
            <div class="msg-wrapper bot-wrapper">
                <div class="sender-name">주동자</div>
                <div class="msg bot">ㅁㅊㄴ인가 진짜 왜 읽씹함? 긁혔냐? ㅋㅋㅋ</div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h2 class="panel-header">학생 답변 후보 (클릭하여 전송)</h2>
        <div id="suggestions-box"></div>
    </div>

    <script>
        var socket = io();
        var chatBox = document.getElementById('chat-box');
        var suggestionsBox = document.getElementById('suggestions-box');

        // 시작 시 스크롤을 맨 아래로 내림
        chatBox.scrollTop = chatBox.scrollHeight;

        // 채팅 업데이트 수신 부분만 이걸로 수정!
        socket.on('chat_update', function(data) {
            // 보낸 사람이 '우리 반'이 아니면 전부 가해자 무리(봇)로 취급
            var isBot = data.sender !== '우리 반';
            
            var wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper ' + (isBot ? 'bot-wrapper' : 'user-wrapper');
            
            if(isBot) {
                var nameDiv = document.createElement('div');
                nameDiv.className = 'sender-name';
                // 하드코딩 되어있던 "주동자" 대신, 봇이 정해준 이름을 그대로 출력!
                nameDiv.innerText = data.sender; 
                wrapper.appendChild(nameDiv);
            }
            
            var msgDiv = document.createElement('div');
            msgDiv.className = 'msg ' + (isBot ? 'bot' : 'user');
            msgDiv.innerText = data.message;
            wrapper.appendChild(msgDiv);
            
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        socket.on('receive_suggestion', function(data) {
            var div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerText = data.message;
            div.onclick = function() {
                if(confirm('이 답변을 채택하여 봇에게 보내겠습니까?\n\n"' + data.message + '"')) {
                    socket.emit('send_to_bot', { message: data.message });
                    suggestionsBox.innerHTML = '';
                }
            };
            suggestionsBox.appendChild(div);
        });
    </script>
</body>
</html>
